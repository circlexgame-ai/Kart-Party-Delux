
name: Extract ZIP automatically

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          for file in *.zip; do
            [ -f "$file" ] || continue
            folder="${file%.zip}"
            mkdir -p "$folder"
            unzip -o "$file" -d "$folder"
            rm "$file"
          done

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ZIP files" || exit 0
          git push
